[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-redaction"
version = "1.0.0"
description = "Local face and license-plate video redaction (ONNX/OpenCV) for privacy-safe AI pipelines"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Open Redaction contributors" }]
keywords = ["privacy", "redaction", "face-blur", "license-plate", "onnx", "opencv", "safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "opencv-python-headless>=4.8.0",
  "onnxruntime>=1.16.0",
  "numpy>=1.24.0",
  "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
youtube = ["yt-dlp>=2024.1.0"]
train = ["ultralytics>=8.0.0"]

[project.scripts]
open-redact = "open_redaction.cli:main"
open-redact-studio = "open_redaction.studio_cli:main"

[project.urls]
Homepage = "https://github.com/ZararB/open-redaction"
Documentation = "https://github.com/ZararB/open-redaction#readme"
Repository = "https://github.com/ZararB/open-redaction"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_redaction*", "agents*", "training*"]

[tool.setuptools.package-data]
"agents.ml.face_blur" = ["models/*.onnx", "models/*_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
